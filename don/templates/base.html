{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donzel</title>
  </head>
  <body>
  <nav class="navbar navbar-expand-lg sticky-top"
     style="background: rgba(10,10,10,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(197, 168, 128, 0.2);">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3 text-uppercase" style="color: #c5a880; font-family: 'Cormorant Garamond', serif; letter-spacing: 3px;" href="{% url 'home' %}">
            ✨ DONZEL
        </a>

        <button class="navbar-toggler bg-warning border-0"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <div class="navbar-nav ms-auto align-items-center gap-3">

                <a class="nav-link text-uppercase fw-semibold {% if request.resolver_match.url_name == 'home' %}active{% endif %}" style="color: #c5a880; font-size: 13px; letter-spacing: 1.5px;"
                   href="{% url 'home' %}">
                    Home
                </a>

                <a class="nav-link text-uppercase fw-semibold {% if request.resolver_match.url_name == 'menu' %}active{% endif %}" style="color: #d1d1d1; font-size: 13px; letter-spacing: 1.5px;"
                   href="{% url 'menu' %}">
                    Menu
                </a>

                <a class="nav-link text-uppercase fw-semibold {% if request.resolver_match.url_name == 'customizer' %}active{% endif %}" style="color: #d1d1d1; font-size: 13px; letter-spacing: 1.5px;"
                   href="{% url 'customizer' %}">
                    Customizer 🍨
                </a>

                <a class="nav-link text-uppercase fw-semibold {% if request.resolver_match.url_name == 'about' %}active{% endif %}" style="color: #d1d1d1; font-size: 13px; letter-spacing: 1.5px;"
                   href="{% url 'about' %}">
                    About
                </a>

                <a class="nav-link text-uppercase fw-semibold" style="color: #c5a880; font-size: 13px; letter-spacing: 1.5px;"
                   href="{% url 'cart' %}">
                    🛒 Cart ({% if cart_count %}{{ cart_count }}{% else %}0{% endif %})
                </a>

                {% if user.is_authenticated %}
                <span class="badge rounded-pill px-3 py-2" style="background: rgba(197, 168, 128, 0.15); color: #c5a880; border: 1px solid rgba(197, 168, 128, 0.3);">👤 {{ user.username }}</span>
                <a class="btn btn-sm btn-outline-warning rounded-pill px-3 text-uppercase" style="font-size: 11px; letter-spacing: 1px;"
                   href="{% url 'logout' %}">
                    Logout
                </a>
                {% else %}
                <a class="btn btn-sm btn-warning rounded-pill px-4 text-uppercase fw-bold" style="font-size: 11px; letter-spacing: 1.5px; background: #c5a880; border-color: #c5a880; color: #111;"
                   href="{% url 'login' %}">
                    Sign In
                </a>
                {% endif %}

            </div>

        </div>

    </div>

</nav>
 
    <div class="container">{% block content %} {% endblock %}</div>
    <footer class="text-center text-lg-start bg-light text-muted mt-4">
    <div class="text-center p-4">
      © Copyright -
      <a
        class="text-reset fw-bold text-decoration-none"
        target="_blank"
        href="https://github.com/Krisha137"
      >
        Krisha Virani
      </a>
    </div>
  </footer>
  </body>
  <style>
        body,footer {
            background-color: #fce8f3; 
            background-image: url("{% static 'images/background.png' %}");
            background-repeat: repeat;
            background-size: 180px;
            background-attachment: fixed;
        }
    </style>
  
</html>
